org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation fails on Windows when plugin sources (C:\pub-cache)
# and the project build dir (E:\) are on different drives — relative paths can't be computed.
kotlin.incremental=false
# builtInKotlin=false: 11 third-party plugins (audio_service, audioplayers,
# firebase_analytics, home_widget, share_plus, etc.) still apply kotlin-android
# themselves. AGP 9.0 builtInKotlin=true rejects that — keep false until all
# plugins migrate to the new built-in Kotlin API.
android.builtInKotlin=false

# Disable R8 full mode for safer reflection-heavy plugin compatibility.
# Full mode (default in AGP 7+) is more aggressive at removing classes
# even when -keep rules are present, which causes runtime crashes in
# plugins like awesome_notifications that load receivers by name from
# AndroidManifest. Trade-off: ~5-10% larger AAB but reliable crash-free.
android.enableR8.fullMode=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

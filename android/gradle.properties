org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Disable R8 full mode for safer reflection-heavy plugin compatibility.
# Full mode (default in AGP 7+) is more aggressive at removing classes
# even when -keep rules are present, which causes runtime crashes in
# plugins like awesome_notifications that load receivers by name from
# AndroidManifest. Trade-off: ~5-10% larger AAB but reliable crash-free.
android.enableR8.fullMode=false

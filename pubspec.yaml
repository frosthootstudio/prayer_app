name: prayer_app
description: "Aplikasi waktu shalat dengan kalkulasi offline dan notifikasi adzan."
publish_to: 'none'

version: 1.2.3+22

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Prayer time calculation (offline, null-safe)
  adhan: ^2.0.0

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Notifications

  # State management
  provider: ^6.1.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date formatting
  intl: ^0.20.2
  google_fonts: ^8.1.0
  awesome_notifications: ^0.11.0
  flutter_qiblah: ^3.2.0
  smooth_page_indicator: ^2.0.1
  flutter_native_splash: ^2.4.7

  # Home screen widget
  home_widget: ^0.9.0
  workmanager: ^0.9.0

  # Hijri calendar & calendar widget
  hijri: ^3.0.0
  table_calendar: ^3.1.3
  quran: ^1.4.1
  http: ^1.2.0
  permission_handler: ^12.0.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  audioplayers: ^6.1.0
  in_app_review: ^2.0.9
  package_info_plus: ^10.0.0

  # Share prayer schedule
  screenshot: ^3.0.0
  share_plus: ^13.0.0
  path_provider: ^2.1.5
  gal: ^2.3.1

  # Firebase — Analytics & Crashlytics (no ads in-app, App Open Ad only)
  firebase_core: ^4.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0

  # AdMob — App Open Ad only (no banners, native, interstitial, rewarded)
  google_mobile_ads: ^5.3.1

  # In-App Purchase — one-time premium unlock (no subscription)
  in_app_purchase: ^3.2.0

# geolocator_linux 0.2.4 caps package_info_plus at ^9 but we need ^10 (share_plus
# 13 requires win32 ^6 which package_info_plus 9 cannot satisfy). geolocator_linux
# is a Linux-desktop-only package not compiled for Android/iOS, so this override
# is safe for mobile targets.
dependency_overrides:
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1C2E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#1A1C2E"
  color_dark: "#1A1C2E"
  image: assets/icon/app_icon.png
  image_dark: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#1A1C2E"
    image_dark: assets/icon/app_icon_foreground.png
    icon_background_color_dark: "#1A1C2E"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/arabic/Amiri-Regular.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/arabic/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/arabic/ScheherazadeNew-Regular.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/arabic/NotoNaskhArabic-Regular.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/arabic/Lateef-Regular.ttf
